[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shotcreator-engine"
version = "0.1.0"
description = "Deterministic vertical-video render engine (PIL + ffmpeg)"
requires-python = ">=3.10"
dependencies = ["Pillow>=10"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["shotcreator_engine*"]
