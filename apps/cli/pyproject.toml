[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shotcreator-cli"
version = "0.1.0"
description = "CLI for shotcreator vertical video generator"
requires-python = ">=3.10"
dependencies = ["shotcreator-engine", "shotcreator-ai"]

[project.scripts]
shotcreator = "shotcreator_cli:main"
